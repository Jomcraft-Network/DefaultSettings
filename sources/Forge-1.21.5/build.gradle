plugins {
    id 'net.darkhax.curseforgegradle' version '1.1.18'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

//apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'

base {
    archivesName = "${rootProject.name}"
}

def file_version = version;

version = "1.21.5-${version}-Forge"

test {
    failOnNoDiscoveredTests = false
}

minecraft {
    mappings channel: 'official', version: '1.21.5'

    //reobf = false
    //copyIdeResources = true

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'defaultsettings'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'defaultsettings', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

/*mixin {
    add sourceSets.main, "defaultsettings.refmap.json"
}*/

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.5-55.1.2')
	implementation "curse.maven:jcp-${project.ext.jcplugin_id}:${project.ext.jcplugin_versions[0]}"
   // annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
   // testAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation project(":Core")

    //compileOnly fg.deobf("curse.maven:jcp-${project.ext.jcplugin_id}:${project.ext.jcplugin_versions[0]}")
    //compileOnly project(":Core")
}

processResources {
    inputs.property "version", file_version

    filesMatching(["**/fabric.mod.json", "**/mods.toml"]) {
        expand "version": file_version
    }
}

/*tasks.withType(JavaCompile) {
    source(project(":Core").sourceSets.main.allSource)
}*/

tasks.withType(JavaCompile).configureEach {
    source(project(":Core").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":Core").sourceSets.main.allJava)
}
/*tasks.named("sourcesJar", Jar) {
    from(project(":Core").sourceSets.main.allSource)
}*/

task sourcesJar(type: Jar) {
    from sourceSets.main.allSource
    from(project(":Core").sourceSets.main.allSource)
    archiveClassifier = 'sources'
}

jar {
    manifest {
        attributes([
                'FMLAT': 'defaultsettings_at.cfg',
                "MixinConfigs" : "defaultsettings.mixin.json"
        ])
    }
}

artifacts {
    archives jar
    archives sourcesJar
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    if (System.getenv("CURSE_API") != null && !System.getenv("CURSE_API").equals("")) {
        disableVersionDetection()
        apiToken = System.getenv("CURSE_API")

        def mainFile = upload(318012, jar)
        mainFile.releaseType = project.ext.relType
        mainFile.displayName = "$archivesBaseName-$version"
        mainFile.changelogType = 'html'
        mainFile.changelog = file('../../changelog.html')
        mainFile.addRequirement('jcplugin')
        mainFile.addModLoader('Forge')
        mainFile.addJavaVersion('Java 21')
        mainFile.addGameVersion('Client')
        mainFile.addGameVersion('1.20.6')

        def sourcesFile = mainFile.withAdditionalFile(sourcesJar)
        sourcesFile.changelog = file('../../changelog.html')
        sourcesFile.addRequirement('jcplugin')
        sourcesFile.displayName = "$archivesBaseName-$version-sources"
    }
}

task("copyRelease") {
    dependsOn "build"

    doFirst {
        println "Gathering builds"
        copy {
            def libDir = project.projectDir.toPath().resolve("build/libs")
            from(libDir) {
                include "*.jar"
                exclude "*-dev.jar"
            }
            into "../../build/libs/"
            duplicatesStrategy DuplicatesStrategy.INCLUDE
        }
    }
}