plugins {
    id 'net.darkhax.curseforgegradle' version '1.1.18'
	id 'net.neoforged.gradle.userdev' version '7.0.109'
	id 'idea'
    id 'java-library'
}

archivesBaseName = "DefaultSettings"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
def file_version = "4.0.7";

version = "1.20.5-${file_version}-NeoForge"

minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

runs {
    configureEach {

        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', "defaultsettings"
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', "defaultsettings"
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', "defaultsettings"
    }

    data {
        programArguments.addAll '--mod', "defaultsettings", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:20.5.17-beta"
	implementation("curse.maven:jcp-659192:4430994")
    //implementation project(":Core")
}

processResources {
    inputs.property "version", file_version

    filesMatching(["**/fabric.mod.json", "**/neoforge.mods.toml"]) {
        expand "version": file_version
    }
}

Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
    //source(project(":Core").sourceSets.main.allSource)
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allSource
    //from(project(":Core").sourceSets.main.allSource)
    archiveClassifier = 'sources'
}

jar {
    manifest {
        attributes([
                "FMLAT"                   : "accesstransformer.cfg",
                "Specification-Title"     : "DefaultSettings",
                "Specification-Vendor"    : "Jomcraft Network",
                "Specification-Version"   : file_version,
                "Implementation-Title"    : "DefaultSettings",
                "Implementation-Version"  : file_version,
                "Implementation-Vendor"   : "Jomcraft Network",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd HH:mm:ssZ"),
                "JCPluginVersion"         : "4.0.4"
        ])
    }
}

artifacts {
    archives jar
    archives sourcesJar
}

